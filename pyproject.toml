[project]
name = "cerealbox-ai-studio"
version = "0.1.0"
description = "AI workflow prototype for the CerealBox Agency challenge"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "flask>=3.0.0",
    "pandas>=2.2.0",
    "pytest>=8.0.0",
    "openai>=1.56.0",
    "python-dotenv>=1.0.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.hatch.build.targets.wheel.force-include]
"app/templates" = "app/templates"
"app/static" = "app/static"

[tool.pytest.ini_options]
pythonpath = "."
